<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Meet - Join Call</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Zoom অ্যাপের অফিশিয়াল ফন্ট স্টাইল */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #f7f9fa;
            color: #131619;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header / Logo */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .header-logo {
            height: 22px;
            width: auto;
        }

        /* Hero / Illustration Image */
        .illustration-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .illustration {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Content Section */
        .content {
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            color: #0b5cff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: #131619;
            font-weight: 600;
        }

        .description {
            font-size: 14.5px;
            line-height: 1.5;
            color: #23272a;
            margin-bottom: 20px;
        }

        .description a {
            color: #0b5cff;
            text-decoration: none;
            font-weight: 500;
        }

        .description a:hover {
            text-decoration: underline;
        }

        /* Feature Grid */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 10px;
            margin-bottom: 24px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: #0b5cff;
        }

        .feature-item i {
            font-size: 15px;
            width: 18px;
            text-align: center;
        }

        /* Join Button Link */
        .btn-link {
            text-decoration: none;
            width: 100%;
        }

        .join-btn {
            width: 100%;
            background-color: #0b5cff;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(11, 92, 255, 0.25);
            letter-spacing: -0.2px;
        }

        .join-btn:hover {
            background-color: #004be0;
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        /* Mobile specific adjustments */
        @media (max-width: 360px) {
            .container {
                padding: 16px 12px;
            }
            .brand-title {
                font-size: 22px;
            }
            .feature-item {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Logo -->
        <div class="header">
            <img src="logo.png" alt="Zoom" class="header-logo" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
            <span id="alt-logo" style="display:none; color:#0b5cff; font-weight:bold; font-size:18px;"><i class="fa-solid fa-video"></i> zoom</span>
        </div>

        <!-- Main Banner/Illustration Image -->
        <div class="illustration-container">
            <img src="icon2.jpg" alt="Zoom Call Illustration" class="illustration">
        </div>

        <!-- Text & Content -->
        <div class="content">
            <h1 class="brand-title">Meet <span>Workplace</span></h1>
            <p class="description">
                Make teamwork more meaningful across hybrid teams with modern collaboration solutions. <a href="#">Learn more</a>
            </p>

            <!-- 2-Column Features List -->
            <div class="features-grid">
                <div class="feature-item">
                    <i class="fa-solid fa-video"></i>
                    <span>Meetings</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Productivity</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>Team Chat</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-heart"></i>
                    <span>Employee Engagement</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>Phone</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-desktop"></i>
                    <span>Flexible Workspaces</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Mail & Calendar</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Workvivo</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Scheduler</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-shapes"></i>
                    <span>App Marketplace</span>
                </div>
            </div>
        </div>

        <!-- Button with Link to Folder -->
        <a href="./Qwz/" class="btn-link">
            <button class="join-btn">Join Google Meet Call</button>
        </a>
    </div>

</body>
</html>
